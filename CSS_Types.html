<html>

<head>
    <title> CSS Types </title>
    <link rel="stylesheet" href="design.css">
    <style>
        h4 {
            font-family: Arial;
            text-decoration: underline;
            background-color: grey;
            color: white;
        }
    </style>
</head>

<body>
    <Center>
        <p>Types Of Cascading Style Sheets</p>
        This is Example of Internal CSS:
        <h4>Hello World</h4>
        This is Example of Inline CSS:
        <h5 style="font-size:35px; color:grey">Hello World</h5>
        This is Example of External CSS:
        <h3>Hello World</h3>
    </Center>
</body>
