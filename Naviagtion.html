<!DOCTYPE html>
<html>
<head>
    <title>My Academic Portal</title>
    <style>
        body {
            font-family: 'Times New Roman';
            text-align: center;
        }
        .nav {
            height: 50px;
            margin: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
        #content{

            height: 600px;
            border: 1px solid #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Academic Portal</h1>

    <div class="nav">
        <button onclick="loadContent('cv')">My CV</button>
        <button onclick="loadContent('institute')">Institute Website</button>
        <button onclick="loadContent('department')">Department Website</button>
        <button onclick="loadContent('tutorial')">Tutorial</button>
    </div>

    <div id="content">
        <iframe id="frame"></iframe>
    </div>

    <script>
        function loadContent(type) {
            const frame = document.getElementById("frame");

            if (type === 'cv') {
                frame.src = "Resume.html";
            }
            else if (type === 'institute') {
                frame.src = "https://www.lkouniv.ac.in/en";
            }
            else if (type === 'department') {
                frame.src = "https://udrc.lkouniv.ac.in/Department/DepartmentDetail/History?dept=58";
            }
            else if (type === 'tutorial') {
                frame.src = "https://www.geeksforgeeks.org/";
            }
        }
    </script>

</body>
</html>
